[package]
name = "kinu-guardian-mockdcl"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Test-only stand-in for Rhea DCL used by the sandbox tests."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(near)"]
