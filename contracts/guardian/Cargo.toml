[package]
name = "kinu-guardian-shared"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/kinuonnear/kinu-lp-guardian"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Sandbox tests only: a 10-minute admin delay instead of 48 hours (never deployed; get_config shows it).
short-delay = []

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
