[package]
name = "kinu-guardian-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/kinuonnear/kinu-lp-guardian"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
blake2b_simd = { version = "1", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
