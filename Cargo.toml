[workspace]
members = ["contracts/vault", "contracts/probe", "contracts/testtoken", "contracts/mockdcl", "contracts/factory", "contracts/cleanup", "contracts/guardian", "tests"]
resolver = "3"
# The agent is its own workspace (wasm32-wasip2, own lockfile); tests use it as a path dependency.
exclude = ["agent"]

[workspace.dependencies]
near-sdk = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
