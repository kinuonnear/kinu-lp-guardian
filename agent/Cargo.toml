[package]
name = "kinu-guardian-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "KINU LP Guardian agent: runs in an OutLayer TEE, signs with a key bound to this exact build"

[[bin]]
name = "kinu-guardian-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Built on its own (target wasm32-wasip2), not part of the contracts workspace.
[workspace]
